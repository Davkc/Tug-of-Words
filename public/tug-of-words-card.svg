  <path d="M0 545H1200" stroke="#ded8cc" stroke-width="2"/>
  <text x="76" y="92" fill="#20211f" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="7">TUG OF WORDS</text>
  <circle cx="1090" cy="82" r="7" fill="#75b66d"/><text x="1110" y="89" fill="#6e6d66" font-family="monospace" font-size="13" letter-spacing="2">LIVE</text>
  <text x="76" y="275" fill="#20211f" font-family="Arial,sans-serif" font-size="112" font-weight="700" letter-spacing="-7">WORDS HAVE</text>
  <text x="76" y="385" fill="#ef5946" font-family="Georgia,serif" font-size="120" font-style="italic" letter-spacing="-7">weight.</text>
