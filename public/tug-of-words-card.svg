<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tug of Words</title>
  <desc id="desc">A bold red and blue tug of war rope, ready for the next word battle.</desc>
