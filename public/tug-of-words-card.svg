  <text x="1120" y="595" text-anchor="end" fill="#274fa7" font-family="monospace" font-size="15" font-weight="700" letter-spacing="3">BLUE TEAM</text>
  <rect x="76" y="635" width="1048" height="1" fill="#ded8cc"/><text x="76" y="674" fill="#99978f" font-family="monospace" font-size="12" letter-spacing="2">REAL-TIME MULTIPLAYER · NODE.JS · WEBSOCKETS</text>
